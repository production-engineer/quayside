[pytest]
DJANGO_SETTINGS_MODULE = quayside.settings
markers =
    fix: correct-behavior tests for endpoints broken on the old (Mongo) backend; red on Mongo, green only after the Postgres port.
    mongomock_gap: behavior that is correct on real Mongo and on Postgres but cannot be emulated by mongomock (e.g. unique indexes, DoesNotExist on get); excluded from the Mongo green proof, must pass on Postgres.

