name: pm tests

on:
  pull_request:
    paths:
      - "pm/**"
      - ".github/workflows/pm-tests.yml"
  push:
    branches:
      - dev
    paths:
      - "pm/**"

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run pm tests
        run: python3 -m unittest discover -s pm/tests -t .
